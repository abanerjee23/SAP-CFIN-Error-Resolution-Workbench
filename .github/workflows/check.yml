name: Software checks
on: [push, pull_request]
env:
  LOG_ONLY_ENABLED: "false"
  PAID_MODELS_ENABLED: "false"
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --group dev
        working-directory: backend
      - run: uv run ruff check . ../examples
        working-directory: backend
      - run: uv run pytest -q
        working-directory: backend
      - run: uv run python -m unittest discover -s ../examples -p "test_*.py"
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            .railway/package-lock.json
      - run: npm ci --prefix .railway --ignore-scripts
      - run: npm run check --prefix .railway
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm run build
        working-directory: frontend

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_PASSWORD: cfin-ci-only
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --group dev
        working-directory: backend
      - run: uv run pytest -q tests/test_log_only_migration.py
        working-directory: backend
        env:
          CFIN_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          PAID_MODELS_ENABLED: 'false'
          LOG_ONLY_ENABLED: 'false'
